<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>100時間未満｜オススメのパーク</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #F4F5F2;
      --surface: #FFFFFF;
      --text: #292D32;
      --muted: #687572;
      --teal: #477F7D;
      --teal-light: #E7F0EE;
      --border: #E1E7E3;
      --amber: #E7B86A;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        Meiryo,
        sans-serif;
      line-height: 1.9;
    }

    header {
      background: var(--surface);
      color: var(--text);
      text-align: center;
      padding: 30px 20px;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      margin: 0;
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    main {
      max-width: 960px;
      margin: 36px auto;
      padding: 0 20px;
    }

    .content {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 36px;
      box-shadow: 0 8px 28px rgba(35, 52, 49, 0.05);
    }

    h2 {
      margin: 40px 0 24px;
      padding: 12px 16px;
      background: var(--teal-light);
      border-left: 5px solid var(--teal);
      border-radius: 8px;
      font-size: 1.45rem;
      line-height: 1.5;
    }

    h2:first-child {
      margin-top: 0;
    }

    h3 {
      margin: 30px 0 14px;
      padding: 10px 14px;
      background: #F7F8F6;
      border: 1px solid var(--border);
      border-radius: 9px;
      font-size: 1.2rem;
      line-height: 1.6;
    }

    /* パーク名とアイコン */
    .perk-heading {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .perk-icon {
      display: block;
      width: 64px;
      height: 64px;
      object-fit: contain;
      flex-shrink: 0;
    }

      margin: 0 0 20px;
    }
