<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>コメント管理｜逃げラッコ</title>

<style>

body {
  margin: 0;
  padding: 40px 20px;
  background: #f4f0e7;
  color: #30271f;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    "Yu Gothic",
    Meiryo,
    sans-serif;
  line-height: 1.7;
}

.container {
  max-width: 900px;
  margin: auto;
}

h1 {
  margin-bottom: 30px;
}

h2 {
  margin-top: 0;
  margin-bottom: 20px;
}

.panel {
  padding: 24px;
  background: #fffdf8;
  border: 1px solid #e6ddd0;
  border-radius: 14px;
  margin-bottom: 20px;
}

input,
select,
textarea {
  width: 100%;
  padding: 12px;
  margin-bottom: 10px;
  border: 1px solid #d8cec0;
  border-radius: 8px;
  box-sizing: border-box;
  font: inherit;
  background: #fff;
  color: #30271f;
}

textarea {
  min-height: 130px;
  resize: vertical;
}

input:focus,
select:focus,
textarea:focus {
  outline: none;
  border-color: #477f7d;
  box-shadow: 0 0 0 3px rgba(71, 127, 125, .12);
}

button {
  border: 0;
  padding: 10px 16px;
  border-radius: 20px;
  background: #477f7d;
  color: white;
  font: inherit;
  font-weight: 800;
  cursor: pointer;
}

button:hover {
  opacity: .9;
}

button.delete {
  background: #a24d4d;
}

button.logout {
  background: #777;
}

button:disabled {
  opacity: .5;
  cursor: default;
}

.comment {
  padding: 18px 0;
  border-top: 1px solid #e6ddd0;
}

.comment:first-child {
  border-top: 0;
}

.comment-name {
  font-weight: 800;
}

.comment-date {
  margin-left: 10px;
  color: #71685f;
  font-size: 12px;
}

.comment-page {
  display: inline-block;
  margin-left: 10px;
  padding: 2px 8px;
  border-radius: 999px;
  background: #e7f0ee;
  color: #477f7d;
  font-size: 11px;
  font-weight: 800;
}

.comment-body {
  margin: 8px 0 12px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.message {
  color: #71685f;
}

.error {
  color: #a24d4d;
}

.admin-comment-form {
  margin-top: 10px;
}

.form-field {
  margin-bottom: 16px;
}

.form-field label {
  display: block;
  margin-bottom: 6px;
  font-weight: 800;
}

.form-note {
  margin: 0 0 18px;
  color: #71685f;
  font-size: 13px;
}

#admin-panel {
  display: none;
}

</style>
</head>


<body>

<div class="container">

  <h1>🦦 コメント管理</h1>


  <!-- ========================= -->
  <!-- ログイン -->
  <!-- ========================= -->

  <section
    id="login-panel"
    class="panel">

    <h2>管理人ログイン</h2>

    <input
      id="email"
      type="email"
      placeholder="メールアドレス">

    <input
      id="password"
      type="password"
      placeholder="パスワード">

    <button
      id="login-button">
      ログイン
    </button>

    <p
      id="login-message"
      class="message">
    </p>

  </section>


  <!-- ========================= -->
  <!-- 管理画面 -->
  <!-- ========================= -->

  <section
    id="admin-panel">


    <!-- ========================= -->
    <!-- 管理人コメント -->
    <!-- ========================= -->

    <div class="panel">

      <h2>🦦 管理人コメント</h2>

      <p class="form-note">
        管理人としてコメントを投稿できます。投稿したコメントは最初から承認済みになります。
      </p>

      <form
        id="admin-comment-form"
        class="admin-comment-form">

        <div class="form-field">

          <label for="admin-comment-page">
            投稿先ページ
          </label>

          <select id="admin-comment-page">

            <option value="fun">
              DbDの楽しみ方
            </option>

            <option value="playstyle">
              立ち回り講座
            </option>

            <option value="perks">
              パーク紹介
            </option>

            <option value="beginner">
              初心者ガイド
            </option>

          </select>

        </div>


        <div class="form-field">

          <label for="admin-comment-body">
            コメント
          </label>

          <textarea
            id="admin-comment-body"
            maxlength="1000"
            placeholder="管理人コメントを書いてね🦦"
            required></textarea>

        </div>


        <button
          id="admin-comment-submit"
          type="submit">
          管理人コメントを投稿する
        </button>


        <p
          id="admin-comment-message"
          class="message">
        </p>

      </form>

    </div>


    <!-- ========================= -->
    <!-- ログアウト -->
    <!-- ========================= -->

    <div class="panel">

      <button
        id="logout-button"
        class="logout">
        ログアウト
      </button>

    </div>


    <!-- ========================= -->
    <!-- 未承認コメント -->
    <!-- ========================= -->

    <div class="panel">

      <h2>未承認コメント</h2>

      <div id="pending-comments">

        <p class="message">
          読み込んでいます……
        </p>

      </div>

    </div>


    <!-- ========================= -->
    <!-- 承認済みコメント -->
    <!-- ========================= -->

    <div class="panel">

      <h2>承認済みコメント</h2>

      <div id="approved-comments">

        <p class="message">
          読み込んでいます……
        </p>

      </div>

    </div>


  </section>

</div>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
  "https://goxuhivbgaextkhyobmw.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_81GtdIt16_VTgJq4bV3RNw_MoA7ZuPV";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


// ============================================
// 管理人UID
// ============================================

const ADMIN_USER_ID =
  "394936fc-0cdf-4129-bf3c-070d3441f4bf";


// ============================================
// ページ名
// ============================================

const PAGE_NAMES = {

  fun:
    "DbDの楽しみ方",

  playstyle:
    "立ち回り講座",

  perks:
    "パーク紹介",

  beginner:
    "初心者ガイド"

};


// ============================================
// 要素取得
// ============================================

const loginPanel =
  document.getElementById("login-panel");

const adminPanel =
  document.getElementById("admin-panel");

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const loginButton =
  document.getElementById("login-button");

const loginMessage =
  document.getElementById("login-message");

const logoutButton =
  document.getElementById("logout-button");

const pendingComments =
  document.getElementById("pending-comments");

const approvedComments =
  document.getElementById("approved-comments");


const adminCommentForm =
  document.getElementById(
    "admin-comment-form"
  );

const adminCommentPage =
  document.getElementById(
    "admin-comment-page"
  );

const adminCommentBody =
  document.getElementById(
    "admin-comment-body"
  );

const adminCommentSubmit =
  document.getElementById(
    "admin-comment-submit"
  );

const adminCommentMessage =
  document.getElementById(
    "admin-comment-message"
  );


// ============================================
// ログイン
// ============================================

loginButton.addEventListener(
  "click",
  async () => {

    loginButton.disabled = true;

    loginMessage.textContent =
      "ログインしています……";


    const {
      error
    } =
      await supabaseClient.auth.signInWithPassword({

        email:
          emailInput.value.trim(),

        password:
          passwordInput.value

      });


    if (error) {

      console.error(
        "ログインエラー:",
        error
      );

      loginMessage.textContent =
        "ログインできませんでした。";

      loginButton.disabled = false;

      return;
    }


    loginMessage.textContent =
      "";

    loginButton.disabled = false;

    await checkAdmin();

  }
);


// ============================================
// 管理人確認
// ============================================

async function checkAdmin() {

  const {
    data: {
      user
    }
  } =
    await supabaseClient.auth.getUser();


  if (!user) {

    loginPanel.style.display =
      "block";

    adminPanel.style.display =
      "none";

    return;
  }


  // 管理人UID確認

  if (
    user.id !== ADMIN_USER_ID
  ) {

    await supabaseClient.auth.signOut();

    loginPanel.style.display =
      "block";

    adminPanel.style.display =
      "none";

    loginMessage.textContent =
      "管理人アカウントではありません。";

    return;
  }


  loginPanel.style.display =
    "none";

  adminPanel.style.display =
    "block";


  await loadComments();

}


// ============================================
// コメント読み込み
// ============================================

async function loadComments() {

  pendingComments.innerHTML =
    '<p class="message">読み込んでいます……</p>';

  approvedComments.innerHTML =
    '<p class="message">読み込んでいます……</p>';


  const {
    data,
    error
  } =
    await supabaseClient

      .from("diary_comments")

      .select(
        "id, display_name, body, approved, created_at, page_slug"
      )

      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(
      "コメント取得エラー:",
      error
    );


    pendingComments.innerHTML =
      '<p class="error">コメントを読み込めませんでした。</p>';

    approvedComments.innerHTML =
      '<p class="error">コメントを読み込めませんでした。</p>';

    return;
  }


  const pending =
    data.filter(
      comment =>
        comment.approved === false
    );


  const approved =
    data.filter(
      comment =>
        comment.approved === true
    );


  renderComments(
    pendingComments,
    pending,
    false
  );


  renderComments(
    approvedComments,
    approved,
    true
  );

}


// ============================================
// コメント表示
// ============================================

function renderComments(
  container,
  comments,
  isApproved
) {

  if (
    !comments ||
    comments.length === 0
  ) {

    container.innerHTML =
      '<p class="message">コメントはありません。</p>';

    return;
  }


  container.innerHTML =
    "";


  comments.forEach(
    comment => {

      const item =
        document.createElement("div");

      item.className =
        "comment";


      // ==============================
      // 名前
      // ==============================

      const name =
        document.createElement("div");

      name.className =
        "comment-name";

      name.textContent =
        comment.display_name ||
        "名無しのラッコ";


      // ==============================
      // 日付
      // ==============================

      const date =
        document.createElement("span");

      date.className =
        "comment-date";


      if (comment.created_at) {

        date.textContent =
          new Date(
            comment.created_at
          ).toLocaleString(
            "ja-JP",
            {
              year: "numeric",
              month: "2-digit",
              day: "2-digit",
              hour: "2-digit",
              minute: "2-digit"
            }
          );

      }


      name.appendChild(
        date
      );


      // ==============================
      // 投稿先ページ
      // ==============================

      const page =
        document.createElement("span");

      page.className =
        "comment-page";


      page.textContent =
        PAGE_NAMES[
          comment.page_slug
        ] ||
        comment.page_slug ||
        "ページ不明";


      name.appendChild(
        page
      );


      // ==============================
      // 本文
      // ==============================

      const body =
        document.createElement("div");

      body.className =
        "comment-body";

      body.textContent =
        comment.body || "";


      // ==============================
      // ボタン
      // ==============================

      const actions =
        document.createElement("div");

      actions.className =
        "actions";


      // 未承認なら承認ボタン

      if (!isApproved) {

        const approveButton =
          document.createElement("button");

        approveButton.textContent =
          "承認";


        approveButton.addEventListener(
          "click",
          () => approveComment(
            comment.id
          )
        );


        actions.appendChild(
          approveButton
        );

      }


      // 削除ボタン

      const deleteButton =
        document.createElement("button");

      deleteButton.textContent =
        "削除";

      deleteButton.className =
        "delete";


      deleteButton.addEventListener(
        "click",
        () => deleteComment(
          comment.id
        )
      );


      actions.appendChild(
        deleteButton
      );


      // ==============================
      // DOMへ追加
      // ==============================

      item.appendChild(
        name
      );

      item.appendChild(
        body
      );

      item.appendChild(
        actions
      );


      container.appendChild(
        item
      );

    }
  );

}


// ============================================
// 管理人コメント投稿
// ============================================

adminCommentForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    const pageSlug =
      adminCommentPage.value;


    const body =
      adminCommentBody.value.trim();


    // 空コメント防止

    if (!body) {

      adminCommentMessage.textContent =
        "コメントを入力してね🦦";

      return;
    }


    // 送信中

    adminCommentSubmit.disabled =
      true;

    adminCommentMessage.textContent =
      "コメントを投稿しています……";


    const {
      data: {
        user
      }
    } =
      await supabaseClient.auth.getUser();


    if (!user) {

      adminCommentMessage.textContent =
        "ログインが切れています。もう一度ログインしてね。";

      adminCommentSubmit.disabled =
        false;

      return;
    }


    const {
      error
    } =
      await supabaseClient

        .from("diary_comments")

        .insert([

          {

            display_name:
              "管理人",

            body:
              body,

            approved:
              true,

            page_slug:
              pageSlug

          }

        ]);


    // エラー

    if (error) {

      console.error(
        "管理人コメント投稿エラー:",
        error
      );

      adminCommentMessage.textContent =
        "コメントを投稿できませんでした。";

      adminCommentSubmit.disabled =
        false;

      return;
    }


    // 成功

    adminCommentBody.value =
      "";

    adminCommentMessage.textContent =
      "管理人コメントを投稿しました！🦦";

    adminCommentSubmit.disabled =
      false;


    await loadComments();

  }
);


// ============================================
// 承認
// ============================================

async function approveComment(
  id
) {

  const {
    error
  } =
    await supabaseClient

      .from("diary_comments")

      .update({

        approved:
          true

      })

      .eq(
        "id",
        id
      );


  if (error) {

    console.error(
      "承認エラー:",
      error
    );

    alert(
      "コメントを承認できませんでした。"
    );

    return;
  }


  await loadComments();

}


// ============================================
// 削除
// ============================================

async function deleteComment(
  id
) {

  const confirmed =
    confirm(
      "このコメントを削除しますか？"
    );


  if (!confirmed) {

    return;

  }


  const {
    error
  } =
    await supabaseClient

      .from("diary_comments")

      .delete()

      .eq(
        "id",
        id
      );


  if (error) {

    console.error(
      "削除エラー:",
      error
    );

    alert(
      "コメントを削除できませんでした。"
    );

    return;
  }


  await loadComments();

}


// ============================================
// ログアウト
// ============================================

logoutButton.addEventListener(
  "click",
  async () => {

    await supabaseClient.auth.signOut();

    loginPanel.style.display =
      "block";

    adminPanel.style.display =
      "none";

  }
);


// ============================================
// 初期処理
// ============================================

checkAdmin();

</script>

</body>
</html>
