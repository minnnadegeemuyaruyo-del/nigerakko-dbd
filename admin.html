<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>コメント管理｜逃げラッコ</title>

<style>

body {
  margin: 0;
  padding: 40px 20px;
  background: #f4f0e7;
  color: #30271f;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    "Yu Gothic",
    Meiryo,
    sans-serif;
  line-height: 1.7;
}

.container {
  max-width: 900px;
  margin: auto;
}

h1 {
  margin-bottom: 30px;
}

h2 {
  margin-top: 40px;
}

.panel {
  padding: 24px;
  background: #fffdf8;
  border: 1px solid #e6ddd0;
  border-radius: 14px;
  margin-bottom: 20px;
}

input {
  width: 100%;
  padding: 12px;
  margin-bottom: 10px;
  border: 1px solid #d8cec0;
  border-radius: 8px;
  box-sizing: border-box;
  font: inherit;
}

button {
  border: 0;
  padding: 10px 16px;
  border-radius: 20px;
  background: #477f7d;
  color: white;
  font: inherit;
  font-weight: 800;
  cursor: pointer;
}

button:hover {
  opacity: .9;
}

button.delete {
  background: #a24d4d;
}

button.logout {
  background: #777;
}

button:disabled {
  opacity: .5;
  cursor: default;
}

.comment {
  padding: 18px 0;
  border-top: 1px solid #e6ddd0;
}

.comment:first-child {
  border-top: 0;
}

.comment-name {
  font-weight: 800;
}

.comment-date {
  margin-left: 10px;
  color: #71685f;
  font-size: 12px;
}

.comment-body {
  margin: 8px 0 12px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.message {
  color: #71685f;
}

.error {
  color: #a24d4d;
}

#admin-panel {
  display: none;
}

</style>
</head>


<body>

<div class="container">

  <h1>🦦 コメント管理</h1>


  <!-- ========================= -->
  <!-- ログイン -->
  <!-- ========================= -->

  <section
    id="login-panel"
    class="panel">

    <h2>管理人ログイン</h2>

    <input
      id="email"
      type="email"
      placeholder="メールアドレス">

    <input
      id="password"
      type="password"
      placeholder="パスワード">

    <button
      id="login-button">
      ログイン
    </button>

    <p
      id="login-message"
      class="message">
    </p>

  </section>


  <!-- ========================= -->
  <!-- 管理画面 -->
  <!-- ========================= -->

  <section
    id="admin-panel">

    <div class="panel">

      <button
        id="logout-button"
        class="logout">
        ログアウト
      </button>

      <h2>未承認コメント</h2>

      <div id="pending-comments">

        <p class="message">
          読み込んでいます……
        </p>

      </div>

    </div>


    <div class="panel">

      <h2>承認済みコメント</h2>

      <div id="approved-comments">

        <p class="message">
          読み込んでいます……
        </p>

      </div>

    </div>

  </section>

</div>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
  "https://goxuhivbgaextkhyobmw.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_81GtdIt16_VTgJq4bV3RNw_MoA7ZuPV";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


// ============================================
// 要素取得
// ============================================

const loginPanel =
  document.getElementById("login-panel");

const adminPanel =
  document.getElementById("admin-panel");

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const loginButton =
  document.getElementById("login-button");

const loginMessage =
  document.getElementById("login-message");

const logoutButton =
  document.getElementById("logout-button");

const pendingComments =
  document.getElementById("pending-comments");

const approvedComments =
  document.getElementById("approved-comments");


// ============================================
// ログイン
// ============================================

loginButton.addEventListener(
  "click",
  async () => {

    loginButton.disabled = true;

    loginMessage.textContent =
      "ログインしています……";


    const {
      error
    } =
      await supabaseClient.auth.signInWithPassword({

        email:
          emailInput.value.trim(),

        password:
          passwordInput.value

      });


    if (error) {

      console.error(
        "ログインエラー:",
        error
      );

      loginMessage.textContent =
        "ログインできませんでした。";

      loginButton.disabled = false;

      return;
    }


    loginMessage.textContent =
      "";

    loginButton.disabled = false;

    await checkAdmin();

  }
);


// ============================================
// 管理人確認
// ============================================

async function checkAdmin() {

  const {
    data: {
      user
    }
  } =
    await supabaseClient.auth.getUser();


  if (!user) {

    loginPanel.style.display =
      "block";

    adminPanel.style.display =
      "none";

    return;
  }


  // 管理人UID確認

  if (
    user.id !==
    "394936fc-0cdf-4129-bf3c-070d3441f4bf"
  ) {

    await supabaseClient.auth.signOut();

    loginPanel.style.display =
      "block";

    adminPanel.style.display =
      "none";

    loginMessage.textContent =
      "管理人アカウントではありません。";

    return;
  }


  loginPanel.style.display =
    "none";

  adminPanel.style.display =
    "block";


  await loadComments();

}


// ============================================
// コメント読み込み
// ============================================

async function loadComments() {

  pendingComments.innerHTML =
    '<p class="message">読み込んでいます……</p>';

  approvedComments.innerHTML =
    '<p class="message">読み込んでいます……</p>';


  const {
    data,
    error
  } =
    await supabaseClient

      .from("diary_comments")

      .select(
        "id, display_name, body, approved, created_at"
      )

      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(
      "コメント取得エラー:",
      error
    );


    pendingComments.innerHTML =
      '<p class="error">コメントを読み込めませんでした。</p>';

    approvedComments.innerHTML =
      '<p class="error">コメントを読み込めませんでした。</p>';

    return;
  }


  const pending =
    data.filter(
      comment =>
        comment.approved === false
    );


  const approved =
    data.filter(
      comment =>
        comment.approved === true
    );


  renderComments(
    pendingComments,
    pending,
    false
  );


  renderComments(
    approvedComments,
    approved,
    true
  );

}


// ============================================
// コメント表示
// ============================================

function renderComments(
  container,
  comments,
  isApproved
) {

  if (
    !comments ||
    comments.length === 0
  ) {

    container.innerHTML =
      '<p class="message">コメントはありません。</p>';

    return;
  }


  container.innerHTML =
    "";


  comments.forEach(
    comment => {

      const item =
        document.createElement("div");

      item.className =
        "comment";


      const name =
        document.createElement("div");

      name.className =
        "comment-name";

      name.textContent =
        comment.display_name ||
        "名無しのラッコ";


      const date =
        document.createElement("span");

      date.className =
        "comment-date";


      if (comment.created_at) {

        date.textContent =
          new Date(
            comment.created_at
          ).toLocaleString(
            "ja-JP",
            {
              year: "numeric",
              month: "2-digit",
              day: "2-digit",
              hour: "2-digit",
              minute: "2-digit"
            }
          );

      }


      name.appendChild(
        date
      );


      const body =
        document.createElement("div");

      body.className =
        "comment-body";

      body.textContent =
        comment.body || "";


      const actions =
        document.createElement("div");

      actions.className =
        "actions";


      if (!isApproved) {

        const approveButton =
          document.createElement("button");

        approveButton.textContent =
          "承認";

        approveButton.addEventListener(
          "click",
          () => approveComment(
            comment.id
          )
        );

        actions.appendChild(
          approveButton
        );

      }


      const deleteButton =
        document.createElement("button");

      deleteButton.textContent =
        "削除";

      deleteButton.className =
        "delete";

      deleteButton.addEventListener(
        "click",
        () => deleteComment(
          comment.id
        )
      );

      actions.appendChild(
        deleteButton
      );


      item.appendChild(
        name
      );

      item.appendChild(
        body
      );

      item.appendChild(
        actions
      );


      container.appendChild(
        item
      );

    }
  );

}


// ============================================
// 承認
// ============================================

async function approveComment(
  id
) {

  const {
    error
  } =
    await supabaseClient

      .from("diary_comments")

      .update({

        approved:
          true

      })

      .eq(
        "id",
        id
      );


  if (error) {

    console.error(
      "承認エラー:",
      error
    );

    alert(
      "コメントを承認できませんでした。"
    );

    return;
  }


  await loadComments();

}


// ============================================
// 削除
// ============================================

async function deleteComment(
  id
) {

  const confirmed =
    confirm(
      "このコメントを削除しますか？"
    );


  if (!confirmed) {

    return;

  }


  const {
    error
  } =
    await supabaseClient

      .from("diary_comments")

      .delete()

      .eq(
        "id",
        id
      );


  if (error) {

    console.error(
      "削除エラー:",
      error
    );

    alert(
      "コメントを削除できませんでした。"
    );

    return;
  }


  await loadComments();

}


// ============================================
// ログアウト
// ============================================

logoutButton.addEventListener(
  "click",
  async () => {

    await supabaseClient.auth.signOut();

    loginPanel.style.display =
      "block";

    adminPanel.style.display =
      "none";

  }
);


// ============================================
// 初期処理
// ============================================

checkAdmin();

</script>

</body>
</html>
