<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>コメント管理｜逃げラッコ</title>

<style>

body {
  margin: 0;
  padding: 40px 20px;
  background: #f4f0e7;
  color: #30271f;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    "Yu Gothic",
    Meiryo,
    sans-serif;
  line-height: 1.7;
}

.container {
  max-width: 900px;
  margin: auto;
}

h1 {
  margin-bottom: 30px;
}

h2 {
  margin-top: 0;
  margin-bottom: 20px;
}

.panel {
  padding: 24px;
  background: #fffdf8;
  border: 1px solid #e6ddd0;
  border-radius: 14px;
  margin-bottom: 20px;
}

input,
select,
textarea {
  width: 100%;
  padding: 12px;
  margin-bottom: 10px;
  border: 1px solid #d8cec0;
  border-radius: 8px;
  box-sizing: border-box;
  font: inherit;
  background: #fff;
  color: #30271f;
}

textarea {
  min-height: 130px;
  resize: vertical;
}

input:focus,
select:focus,
textarea:focus {
  outline: none;
  border-color: #477f7d;
  box-shadow: 0 0 0 3px rgba(71, 127, 125, .12);
}

button {
  border: 0;
  padding: 10px 16px;
  border-radius: 20px;
  background: #477f7d;
  color: white;
  font: inherit;
  font-weight: 800;
  cursor: pointer;
}

button:hover {
  opacity: .9;
}

button.delete {
  background: #a24d4d;
}

button.logout {
  background: #777;
}

button.reply {
  background: #477f7d;
}

button.cancel {
  background: #999;
}

button:disabled {
  opacity: .5;
  cursor: default;
}

.comment {
  padding: 18px 0;
  border-top: 1px solid #e6ddd0;
}

.comment:first-child {
  border-top: 0;
}

.comment-name {
  font-weight: 800;
}

.comment-date {
  margin-left: 10px;
  color: #71685f;
  font-size: 12px;
}

.comment-page {
  display: inline-block;
  margin-left: 10px;
  padding: 2px 8px;
  border-radius: 999px;
  background: #e7f0ee;
  color: #477f7d;
  font-size: 11px;
  font-weight: 800;
}

.comment-body {
  margin: 8px 0 12px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.message {
  color: #71685f;
}

.error {
  color: #a24d4d;
}

/* ========================= */
/* 返信フォーム */
/* ========================= */

.reply-form {
  display: none;
  margin-top: 14px;
  padding: 16px;
  background: #f8f3e9;
  border: 1px solid #e6ddd0;
  border-radius: 12px;
}

.reply-form.visible {
  display: block;
}

.reply-form textarea {
  min-height: 100px;
  margin-bottom: 8px;
}

.reply-form-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.reply-message {
  margin: 8px 0 0;
  color: #71685f;
  font-size: 13px;
}

/* ========================= */
/* 管理人コメント表示 */
/* ========================= */

.admin-reply {
  margin-left: 24px;
  padding-left: 16px;
  border-left: 4px solid #477f7d;
}

#admin-panel {
  display: none;
}

</style>
</head>


<body>

<div class="container">

  <h1>🦦 コメント管理</h1>


  <!-- ========================= -->
  <!-- ログイン -->
  <!-- ========================= -->

  <section
    id="login-panel"
    class="panel">

    <h2>管理人ログイン</h2>

    <input
      id="email"
      type="email"
      placeholder="メールアドレス">

    <input
      id="password"
      type="password"
      placeholder="パスワード">

    <button
      id="login-button">
      ログイン
    </button>

    <p
      id="login-message"
      class="message">
    </p>

  </section>


  <!-- ========================= -->
  <!-- 管理画面 -->
  <!-- ========================= -->

  <section
    id="admin-panel">


    <!-- ========================= -->
    <!-- ログアウト -->
    <!-- ========================= -->

    <div class="panel">

      <button
        id="logout-button"
        class="logout">
        ログアウト
      </button>

    </div>


    <!-- ========================= -->
    <!-- 未承認コメント -->
    <!-- ========================= -->

    <div class="panel">

      <h2>未承認コメント</h2>

      <div id="pending-comments">

        <p class="message">
          読み込んでいます……
        </p>

      </div>

    </div>


    <!-- ========================= -->
    <!-- 承認済みコメント -->
    <!-- ========================= -->

    <div class="panel">

      <h2>承認済みコメント</h2>

      <div id="approved-comments">

        <p class="message">
          読み込んでいます……
        </p>

      </div>

    </div>


  </section>

</div>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
  "https://goxuhivbgaextkhyobmw.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_81GtdIt16_VTgJq4bV3RNw_MoA7ZuPV";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


// ============================================
// 管理人UID
// ============================================

const ADMIN_USER_ID =
  "394936fc-0cdf-4129-bf3c-070d3441f4bf";


// ============================================
// ページ名
// ============================================

const PAGE_NAMES = {

  fun:
    "DbDの楽しみ方",

  playstyle:
    "立ち回り講座",

  perks:
    "パーク紹介",

  beginner:
    "初心者ガイド",

  diary:
    "ブログ"

};


// ============================================
// 要素取得
// ============================================

const loginPanel =
  document.getElementById(
    "login-panel"
  );


const adminPanel =
  document.getElementById(
    "admin-panel"
  );


const emailInput =
  document.getElementById(
    "email"
  );


const passwordInput =
  document.getElementById(
    "password"
  );


const loginButton =
  document.getElementById(
    "login-button"
  );


const loginMessage =
  document.getElementById(
    "login-message"
  );


const logoutButton =
  document.getElementById(
    "logout-button"
  );


const pendingComments =
  document.getElementById(
    "pending-comments"
  );


const approvedComments =
  document.getElementById(
    "approved-comments"
  );


// ============================================
// ログイン
// ============================================

loginButton.addEventListener(
  "click",
  async () => {

    loginButton.disabled =
      true;

    loginMessage.textContent =
      "ログインしています……";


    const {
      error
    } =
      await supabaseClient.auth.signInWithPassword({

        email:
          emailInput.value.trim(),

        password:
          passwordInput.value

      });


    if (error) {

      console.error(
        "ログインエラー:",
        error
      );

      loginMessage.textContent =
        "ログインできませんでした。";

      loginButton.disabled =
        false;

      return;
    }


    loginMessage.textContent =
      "";

    loginButton.disabled =
      false;

    await checkAdmin();

  }
);


// ============================================
// 管理人確認
// ============================================

async function checkAdmin() {

  const {
    data: {
      user
    }
  } =
    await supabaseClient.auth.getUser();


  if (!user) {

    loginPanel.style.display =
      "block";

    adminPanel.style.display =
      "none";

    return;
  }


  if (
    user.id !==
    ADMIN_USER_ID
  ) {

    await supabaseClient.auth.signOut();

    loginPanel.style.display =
      "block";

    adminPanel.style.display =
      "none";

    loginMessage.textContent =
      "管理人アカウントではありません。";

    return;
  }


  loginPanel.style.display =
    "none";

  adminPanel.style.display =
    "block";


  await loadComments();

}


// ============================================
// コメント読み込み
// ============================================

async function loadComments() {

  pendingComments.innerHTML =
    '<p class="message">読み込んでいます……</p>';

  approvedComments.innerHTML =
    '<p class="message">読み込んでいます……</p>';


  const {
    data,
    error
  } =
    await supabaseClient

      .from("diary_comments")

      .select(
        "id, parent_id, display_name, body, approved, created_at, page_slug"
      )

      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(
      "コメント取得エラー:",
      error
    );


    pendingComments.innerHTML =
      '<p class="error">コメントを読み込めませんでした。</p>';

    approvedComments.innerHTML =
      '<p class="error">コメントを読み込めませんでした。</p>';

    return;
  }


  const pending =
    data.filter(
      comment =>
        comment.approved === false
    );


  const approved =
    data.filter(
      comment =>
        comment.approved === true
    );


  renderComments(
    pendingComments,
    pending,
    false
  );


  renderComments(
    approvedComments,
    approved,
    true
  );

}


// ============================================
// コメント表示
// ============================================

function renderComments(
  container,
  comments,
  isApproved
) {

  if (
    !comments ||
    comments.length === 0
  ) {

    container.innerHTML =
      '<p class="message">コメントはありません。</p>';

    return;
  }


  container.innerHTML =
    "";


  comments.forEach(
    comment => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "comment";


      if (
        comment.parent_id !== null &&
        comment.parent_id !== undefined
      ) {

        item.classList.add(
          "admin-reply"
        );

      }


      // ==============================
      // 名前
      // ==============================

      const name =
        document.createElement(
          "div"
        );


      name.className =
        "comment-name";


      name.textContent =
        comment.display_name ||
        "名無しのラッコ";


      // ==============================
      // 日付
      // ==============================

      const date =
        document.createElement(
          "span"
        );


      date.className =
        "comment-date";


      if (comment.created_at) {

        date.textContent =
          new Date(
            comment.created_at
          ).toLocaleString(
            "ja-JP",
            {
              year: "numeric",
              month: "2-digit",
              day: "2-digit",
              hour: "2-digit",
              minute: "2-digit"
            }
          );

      }


      name.appendChild(
        date
      );


      // ==============================
      // 投稿先ページ
      // ==============================

      const page =
        document.createElement(
          "span"
        );


      page.className =
        "comment-page";


      page.textContent =
        PAGE_NAMES[
          comment.page_slug
        ] ||
        comment.page_slug ||
        "ページ不明";


      name.appendChild(
        page
      );


      // ==============================
      // 本文
      // ==============================

      const body =
        document.createElement(
          "div"
        );


      body.className =
        "comment-body";


      body.textContent =
        comment.body || "";


      // ==============================
      // ボタン
      // ==============================

      const actions =
        document.createElement(
          "div"
        );


      actions.className =
        "actions";


      // ==============================
      // 未承認なら承認
      // ==============================

      if (!isApproved) {

        const approveButton =
          document.createElement(
            "button"
          );


        approveButton.textContent =
          "承認";


        approveButton.addEventListener(
          "click",
          () =>
            approveComment(
              comment.id
            )
        );


        actions.appendChild(
          approveButton
        );

      }


      // ==============================
      // 承認済みなら返信
      // ==============================

      if (
        isApproved &&
        comment.parent_id === null
      ) {

        const replyButton =
          document.createElement(
            "button"
          );


        replyButton.textContent =
          "返信";


        replyButton.className =
          "reply";


        replyButton.addEventListener(
          "click",
          () => {

            const form =
              document.getElementById(
                "reply-form-" +
                comment.id
              );


            if (!form) {
              return;
            }


            form.classList.toggle(
              "visible"
            );

          }
        );


        actions.appendChild(
          replyButton
        );

      }


      // ==============================
      // 削除
      // ==============================

      const deleteButton =
        document.createElement(
          "button"
        );


      deleteButton.textContent =
        "削除";


      deleteButton.className =
        "delete";


      deleteButton.addEventListener(
        "click",
        () =>
          deleteComment(
            comment.id
          )
      );


      actions.appendChild(
        deleteButton
      );


      // ==============================
      // DOMへ追加
      // ==============================

      item.appendChild(
        name
      );


      item.appendChild(
        body
      );


      item.appendChild(
        actions
      );


      // ==============================
      // 返信フォーム
      // ==============================

      if (
        isApproved &&
        comment.parent_id === null
      ) {

        const replyForm =
          document.createElement(
            "div"
          );


        replyForm.id =
          "reply-form-" +
          comment.id;


        replyForm.className =
          "reply-form";


        const textarea =
          document.createElement(
            "textarea"
          );


        textarea.placeholder =
          "このコメントへの返信を書いてね🦦";


        textarea.maxLength =
          1000;


        const formActions =
          document.createElement(
            "div"
          );


        formActions.className =
          "reply-form-actions";


        const submitButton =
          document.createElement(
            "button"
          );


        submitButton.type =
          "button";


        submitButton.textContent =
          "返信を投稿";


        submitButton.addEventListener(
          "click",
          () =>
            submitReply(
              comment,
              textarea,
              submitButton,
              replyMessage
            )
        );


        const cancelButton =
          document.createElement(
            "button"
          );


        cancelButton.type =
          "button";


        cancelButton.textContent =
          "キャンセル";


        cancelButton.className =
          "cancel";


        cancelButton.addEventListener(
          "click",
          () => {

            replyForm.classList.remove(
              "visible"
            );

            textarea.value =
              "";

            replyMessage.textContent =
              "";

          }
        );


        formActions.appendChild(
          submitButton
        );


        formActions.appendChild(
          cancelButton
        );


        const replyMessage =
          document.createElement(
            "p"
          );


        replyMessage.className =
          "reply-message";


        replyForm.appendChild(
          textarea
        );


        replyForm.appendChild(
          formActions
        );


        replyForm.appendChild(
          replyMessage
        );


        item.appendChild(
          replyForm
        );

      }


      container.appendChild(
        item
      );

    }
  );

}


// ============================================
// 返信投稿
// ============================================

async function submitReply(
  parentComment,
  textarea,
  submitButton,
  messageElement
) {

  const body =
    textarea.value.trim();


  if (!body) {

    messageElement.textContent =
      "返信を書いてね🦦";

    return;

  }


  submitButton.disabled =
    true;


  messageElement.textContent =
    "返信を投稿しています……";


  const {
    data: {
      user
    }
  } =
    await supabaseClient.auth.getUser();


  if (!user) {

    messageElement.textContent =
      "ログインが切れています。";

    submitButton.disabled =
      false;

    return;

  }


  const {
    error
  } =
    await supabaseClient

      .from("diary_comments")

      .insert([

        {

          page_slug:
            parentComment.page_slug,

          display_name:
            "管理人",

          body:
            body,

          approved:
            true,

          parent_id:
            parentComment.id

        }

      ]);


  if (error) {

    console.error(
      "返信投稿エラー:",
      error
    );


    messageElement.textContent =
      "返信を投稿できませんでした。";


    submitButton.disabled =
      false;

    return;

  }


  messageElement.textContent =
    "返信しました！🦦";


  await loadComments();

}


// ============================================
// 承認
// ============================================

async function approveComment(
  id
) {

  const {
    error
  } =
    await supabaseClient

      .from("diary_comments")

      .update({

        approved:
          true

      })

      .eq(
        "id",
        id
      );


  if (error) {

    console.error(
      "承認エラー:",
      error
    );


    alert(
      "コメントを承認できませんでした。"
    );


    return;

  }


  await loadComments();

}


// ============================================
// 削除
// ============================================

async function deleteComment(
  id
) {

  const confirmed =
    confirm(
      "このコメントを削除しますか？"
    );


  if (!confirmed) {

    return;

  }


  const {
    error
  } =
    await supabaseClient

      .from("diary_comments")

      .delete()

      .eq(
        "id",
        id
      );


  if (error) {

    console.error(
      "削除エラー:",
      error
    );


    alert(
      "コメントを削除できませんでした。"
    );


    return;

  }


  await loadComments();

}


// ============================================
// ログアウト
// ============================================

logoutButton.addEventListener(
  "click",
  async () => {

    await supabaseClient.auth.signOut();


    loginPanel.style.display =
      "block";


    adminPanel.style.display =
      "none";

  }
);


// ============================================
// 初期処理
// ============================================

checkAdmin();

</script>

</body>
</html>
