<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta
  name="description"
  content="逃げラッコの日々を記録する日記ページ。DbD、サイト制作、Discord、Twitchなど、その時その時の出来事を書いていきます。"
>

<title>ラッコの日記｜逃げラッコ式DbD立ち回り</title>

<style>

:root {
  --bg: #f4f0e7;
  --surface: #fffdf8;
  --surface-soft: #f8f3e9;
  --text: #30271f;
  --muted: #71685f;
  --teal: #477f7d;
  --teal-dark: #356865;
  --teal-light: #e7f0ee;
  --border: #e6ddd0;
  --hero-blue: #c9dfe4;
  --shadow: 0 4px 18px rgba(60, 45, 30, .06);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  color: var(--text);
  background: var(--bg);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    "Yu Gothic",
    Meiryo,
    sans-serif;

  line-height: 1.8;
}

a {
  color: inherit;
}


/* ============================================
   ヘッダー
============================================ */

header {
  background: rgba(255,255,255,.97);
  border-bottom: 1px solid var(--border);
}

.header-inner {
  max-width: 1440px;
  min-height: 72px;

  margin: auto;
  padding: 10px 24px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 24px;
}

.brand {
  display: flex;
  align-items: center;

  gap: 10px;

  text-decoration: none;
  flex-shrink: 0;
}

.brand-icon {
  font-size: 37px;
}

.brand-name {
  font-weight: 900;
  font-size: 19px;
  line-height: 1.3;
}

.brand-name small {
  display: block;

  font-size: 12px;
  text-align: center;
}

nav {
  display: flex;
  align-items: center;

  gap: clamp(10px, 1.5vw, 22px);

  flex-wrap: wrap;
}

nav a {
  text-decoration: none;

  font-size: 13px;
  font-weight: 700;

  white-space: nowrap;
}

nav a:hover {
  color: var(--teal);
}

nav a.current {
  color: var(--teal);
}

.discord-link {
  background: #5865F2;
  color: white;

  padding: 10px 14px;

  border-radius: 30px;
}

.discord-link:hover {
  color: white;
  opacity: .9;
}

.twitch-link {
  background: #302b2a;
  color: white;

  padding: 10px 14px;

  border-radius: 30px;
}

.twitch-link:hover {
  color: white;
  opacity: .9;
}


/* ============================================
   ヒーロー
============================================ */

.hero {
  padding: 52px 20px;

  text-align: center;

  background: var(--hero-blue);
}

.hero-inner {
  max-width: 820px;
  margin: auto;
}

.hero-label {
  margin: 0 0 8px;

  color: var(--teal);

  font-size: 13px;
  font-weight: 900;

  letter-spacing: .14em;
}

.hero h1 {
  margin: 0;

  font-size: clamp(32px, 5vw, 48px);

  line-height: 1.35;
}

.hero p {
  margin: 12px 0 0;

  color: #4f625f;

  font-size: 15px;
}


/* ============================================
   メイン
============================================ */

main {
  max-width: 1180px;

  margin: auto;

  padding: 42px 22px 70px;
}


/* ============================================
   日記レイアウト
============================================ */

.diary-layout {
  display: grid;

  grid-template-columns:
    minmax(0, 1fr)
    250px;

  gap: 30px;

  align-items: start;
}


/* ============================================
   日記一覧
============================================ */

.diary-main {
  min-width: 0;
}

.intro-card {
  padding: 28px;

  margin-bottom: 28px;

  background: var(--surface);

  border: 1px solid var(--border);

  border-radius: 18px;

  box-shadow: var(--shadow);
}

.intro-card h2 {
  margin: 0 0 12px;

  font-size: 24px;

  line-height: 1.5;
}

.intro-card p {
  margin: 8px 0;
}

.intro-card p:last-child {
  margin-bottom: 0;
}

.section-title {
  margin: 0 0 18px;

  font-size: 25px;

  line-height: 1.5;
}


/* ============================================
   日記カード
============================================ */

.diary-list {
  display: grid;

  gap: 16px;
}

.diary-card {
  display: block;

  padding: 23px 25px;

  background: var(--surface);

  border: 1px solid var(--border);

  border-radius: 17px;

  box-shadow: 0 2px 10px rgba(60, 45, 30, .035);

  text-decoration: none;

  transition:
    transform .15s ease,
    box-shadow .15s ease,
    border-color .15s ease;
}

.diary-card:hover {
  transform: translateY(-2px);

  border-color: #c9d9d5;

  box-shadow:
    0 6px 20px rgba(60, 45, 30, .08);
}

.diary-card-top {
  display: flex;

  align-items: center;
  justify-content: space-between;

  gap: 12px;

  margin-bottom: 8px;
}

.category-label {
  display: inline-block;

  padding: 4px 11px;

  border-radius: 999px;

  background: var(--teal-light);

  color: var(--teal-dark);

  font-size: 11px;
  font-weight: 900;

  line-height: 1.4;
}

.entry-date {
  color: var(--muted);

  font-size: 12px;

  white-space: nowrap;
}

.entry-title {
  margin: 0;

  color: var(--text);

  font-size: 21px;

  line-height: 1.5;
}

.entry-summary {
  margin: 9px 0 0;

  color: var(--muted);

  font-size: 14px;

  line-height: 1.75;
}

.read-more {
  display: inline-block;

  margin-top: 12px;

  color: var(--teal);

  font-size: 12px;
  font-weight: 900;
}


/* ============================================
   サイドバー
============================================ */

.diary-sidebar {
  position: sticky;

  top: 20px;
}

.sidebar-card {
  padding: 21px;

  background: var(--surface);

  border: 1px solid var(--border);

  border-radius: 17px;

  box-shadow: var(--shadow);
}

.sidebar-card h2 {
  margin: 0 0 15px;

  font-size: 18px;

  line-height: 1.5;
}

.category-list {
  display: grid;

  gap: 7px;
}

.category-button {
  width: 100%;

  padding: 10px 12px;

  border: 1px solid transparent;

  border-radius: 10px;

  background: transparent;

  color: var(--text);

  font: inherit;

  font-size: 13px;
  font-weight: 800;

  text-align: left;

  cursor: pointer;

  transition:
    background .15s ease,
    color .15s ease;
}

.category-button:hover {
  background: var(--teal-light);

  color: var(--teal-dark);
}

.category-button.active {
  background: var(--teal);

  color: white;
}

.category-count {
  float: right;

  opacity: .7;
}


/* ============================================
   件数表示
============================================ */

.list-status {
  margin: 0 0 14px;

  color: var(--muted);

  font-size: 12px;
}


/* ============================================
   記事がない場合
============================================ */

.no-entry {
  padding: 35px 20px;

  background: var(--surface);

  border: 1px dashed var(--border);

  border-radius: 16px;

  color: var(--muted);

  text-align: center;
}


/* ============================================
   戻るリンク
============================================ */

.back-link {
  display: inline-block;

  margin-top: 28px;

  color: var(--teal);

  font-weight: 900;

  text-decoration: none;
}

.back-link:hover {
  text-decoration: underline;
}


/* ============================================
   フッター
============================================ */

footer {
  padding: 20px;

  text-align: center;

  background: #e9e2d6;

  color: #6e6255;

  font-size: 13px;
}


/* ============================================
   フォーカス
============================================ */

a:focus-visible,
button:focus-visible {
  outline: 3px solid var(--teal);

  outline-offset: 3px;
}


/* ============================================
   タブレット
============================================ */

@media (max-width: 900px) {

  .header-inner {
    flex-wrap: wrap;
  }

  nav {
    width: 100%;

    overflow-x: auto;

    flex-wrap: nowrap;

    padding: 5px 0;
  }

  .diary-layout {
    grid-template-columns: 1fr;
  }

  .diary-sidebar {
    position: static;

    order: -1;
  }

  .sidebar-card {
    padding: 18px;
  }

  .category-list {
    display: flex;

    flex-wrap: wrap;

    gap: 7px;
  }

  .category-button {
    width: auto;

    white-space: nowrap;
  }

  .category-count {
    float: none;

    margin-left: 5px;
  }

}


/* ============================================
   スマホ
============================================ */

@media (max-width: 560px) {

  .header-inner {
    padding: 10px 15px;

    gap: 8px;
  }

  .brand-icon {
    font-size: 30px;
  }

  .brand-name {
    font-size: 16px;
  }

  nav {
    gap: 15px;
  }

  nav a {
    font-size: 12px;
  }

  .discord-link,
  .twitch-link {
    padding: 7px 10px;

    font-size: 12px;
  }

  .hero {
    padding: 40px 18px;
  }

  .hero p {
    font-size: 14px;
  }

  main {
    padding: 25px 15px 45px;
  }

  .intro-card {
    padding: 21px;

    border-radius: 15px;
  }

  .intro-card h2 {
    font-size: 21px;
  }

  .section-title {
    font-size: 22px;
  }

  .diary-card {
    padding: 20px;
  }

  .diary-card-top {
    align-items: flex-start;

    flex-direction: column;

    gap: 6px;
  }

  .entry-title {
    font-size: 19px;
  }

}


/* ============================================
   アニメーション軽減
============================================ */

@media (prefers-reduced-motion: reduce) {

  html {
    scroll-behavior: auto;
  }

  .diary-card {
    transition: none;
  }

}

</style>
</head>


<body>


<header>

  <div class="header-inner">

    <a
      class="brand"
      href="index.html"
    >

      <span
        class="brand-icon"
        aria-hidden="true"
      >
        🦦
      </span>

      <span class="brand-name">

        逃げラッコ式

        <small>
          DbD立ち回りガイド
        </small>

      </span>

    </a>


    <nav aria-label="メインメニュー">

      <a href="index.html">
        ホーム
      </a>

      <a
        href="diary.html"
        class="current"
      >
        ラッコの日記
      </a>

      <a
        href="https://discord.gg/SP9GnQDS5f"
        class="discord-link"
        target="_blank"
        rel="noopener noreferrer"
      >
        Discordに参加 ↗
      </a>

      <a
        href="https://www.twitch.tv/rakkowww"
        class="twitch-link"
        target="_blank"
        rel="noopener noreferrer"
      >
        Twitchで配信中 ↗
      </a>

    </nav>

  </div>

</header>


<section class="hero">

  <div class="hero-inner">

    <p class="hero-label">
      RAKKO'S DIARY
    </p>

    <h1>
      ラッコの日記 🦦
    </h1>

    <p>
      その時その時で思いついたことを、
      ラッコの言葉で残していく場所。
    </p>

  </div>

</section>


<main>


  <div class="diary-layout">


    <!-- ======================================
         日記本文
    ======================================= -->

    <section class="diary-main">


      <section class="intro-card">

        <h2>
          ここはラッコの日記帳。
        </h2>

        <p>
          DbDのこと、サイトのこと、ゲームのこと、
          Discordのこと、Twitchのこと。
        </p>

        <p>
          その時その時でラッコが書きたいことを、
          気ままに残していくよ🦦
        </p>

      </section>


      <h2 class="section-title">
        日記一覧
      </h2>


      <p
        id="list-status"
        class="list-status"
      >
        日記を読み込んでいます……
      </p>


      <div
        id="diary-list"
        class="diary-list"
      >
      </div>


      <a
        class="back-link"
        href="index.html"
      >
        ← ホームに戻る
      </a>


    </section>


    <!-- ======================================
         カテゴリー
    ======================================= -->

    <aside class="diary-sidebar">

      <div class="sidebar-card">

        <h2>
          📚 カテゴリー
        </h2>

        <div
          id="category-list"
          class="category-list"
        >
        </div>

      </div>

    </aside>


  </div>


</main>


<footer>
  © 逃げラッコ
</footer>


<script>

/* ==========================================
   日記データ
   ==========================================

   新しい日記を書く時は、
   ここに1件追加するだけ。

========================================== */

const diaryEntries = [

  {
    id: "day1",

    title: "ついにサイトを公開しました！",

    date: "2026-10-25",

    dateLabel: "2026年10月25日",

    categories: [
      "サイト制作",
      "DbD",
      "Twitch"
    ],

summary:
  "というわけで今日から日記をつけていくよ。ちょいちょい更新していくから楽しみにしてね。このサイトを作ろうと思ったきっかけは、ラッコがDbDにハマって、攻略サイトを見て色々研究しようと思った時に……",
    url: "diary-day1.html"
  }

];


/* ==========================================
   カテゴリー定義
========================================== */

const categories = [

  {
    id: "all",
    name: "すべて"
  },

  {
    id: "dbd",
    name: "DbD",
    match: "DbD"
  },

  {
    id: "site",
    name: "サイト制作",
    match: "サイト制作"
  },

  {
    id: "discord",
    name: "Discord",
    match: "Discord"
  },

  {
    id: "twitch",
    name: "Twitch",
    match: "Twitch"
  },

  {
    id: "game",
    name: "ゲーム",
    match: "ゲーム"
  },

  {
    id: "other",
    name: "その他",
    match: "その他"
  }

];


/* ==========================================
   HTML要素
========================================== */

const diaryList =
  document.getElementById(
    "diary-list"
  );


const categoryList =
  document.getElementById(
    "category-list"
  );


const listStatus =
  document.getElementById(
    "list-status"
  );


/* ==========================================
   現在のカテゴリー
========================================== */

let currentCategory =
  "all";


/* ==========================================
   カテゴリー件数
========================================== */

function getCategoryCount(
  category
) {

  if (
    category.id === "all"
  ) {

    return diaryEntries.length;

  }


  return diaryEntries.filter(
    entry =>
      entry.categories.includes(
        category.match
      )
  ).length;

}


/* ==========================================
   カテゴリー一覧表示
========================================== */

function renderCategories() {

  categoryList.innerHTML = "";


  categories.forEach(
    category => {

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "category-button";


      if (
        currentCategory ===
        category.id
      ) {

        button.classList.add(
          "active"
        );

      }


      const name =
        document.createElement(
          "span"
        );


      name.textContent =
        category.name;


      const count =
        document.createElement(
          "span"
        );


      count.className =
        "category-count";


      count.textContent =
        getCategoryCount(
          category
        );


      button.appendChild(
        name
      );


      button.appendChild(
        count
      );


      button.addEventListener(
        "click",
        () => {

          currentCategory =
            category.id;

          renderCategories();

          renderDiaryList();

        }
      );


      categoryList.appendChild(
        button
      );

    }
  );

}


/* ==========================================
   日記一覧表示
========================================== */

function renderDiaryList() {

  diaryList.innerHTML = "";


  let entries =
    diaryEntries;


  if (
    currentCategory !==
    "all"
  ) {

    const category =
      categories.find(
        item =>
          item.id ===
          currentCategory
      );


    if (
      category &&
      category.match
    ) {

      entries =
        diaryEntries.filter(
          entry =>
            entry.categories.includes(
              category.match
            )
        );

    }

  }


  listStatus.textContent =
    `${entries.length}件の日記`;


  if (
    entries.length === 0
  ) {

    diaryList.innerHTML = `
      <div class="no-entry">
        このカテゴリーの日記はまだありません🦦
      </div>
    `;

    return;

  }


  entries.forEach(
    entry => {

      const article =
        document.createElement(
          "a"
        );


      article.className =
        "diary-card";


      article.href =
        entry.url;


      /* ====================================
         上段
      ==================================== */

      const top =
        document.createElement(
          "div"
        );


      top.className =
        "diary-card-top";


      const category =
        document.createElement(
          "span"
        );


      category.className =
        "category-label";


      category.textContent =
        entry.categories[0];


      const date =
        document.createElement(
          "time"
        );


      date.className =
        "entry-date";


      date.textContent =
        entry.dateLabel;


      top.appendChild(
        category
      );


      top.appendChild(
        date
      );


      /* ====================================
         タイトル
      ==================================== */

      const title =
        document.createElement(
          "h3"
        );


      title.className =
        "entry-title";


      title.textContent =
        entry.title;


      /* ====================================
         概要
      ==================================== */

      const summary =
        document.createElement(
          "p"
        );


      summary.className =
        "entry-summary";


      summary.textContent =
        entry.summary;


      /* ====================================
         続きを読む
      ==================================== */

      const readMore =
        document.createElement(
          "span"
        );


      readMore.className =
        "read-more";


      readMore.textContent =
        "続きを読む →";


      /* ====================================
         組み立て
      ==================================== */

      article.appendChild(
        top
      );

      article.appendChild(
        title
      );

      article.appendChild(
        summary
      );

      article.appendChild(
        readMore
      );


      diaryList.appendChild(
        article
      );

    }
  );

}


/* ==========================================
   初期表示
========================================== */

renderCategories();

renderDiaryList();


</script>


</body>
</html>
