        );


      if (
        Number.isNaN(
          date.getTime()
        )
      ) {

        return "";

      }


      return date.toLocaleString(
        "ja-JP",
        {
          year: "numeric",
          month: "numeric",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    }


    // ============================================
    // コメント読み込み
    // ============================================

    async function loadComments() {

      commentList.innerHTML =
        '<div class="comment-empty">コメントを読み込んでいます……🦦</div>';


      const {
        data,
        error
      } =
        await supabaseClient

          .from("diary_comments")

          .select(
            "id, parent_id, display_name, body, created_at"
          )

          .eq(
            "page_slug",
            PAGE_SLUG
          )

          .eq(
            "approved",
            true
          )

          .order(
            "created_at",
            {
              ascending: true
            }
          );


      if (error) {

        console.error(
          "コメント読み込みエラー:",
          error
        );


        commentList.innerHTML =
          '<div class="comment-empty">コメントを読み込めませんでした。</div>';


        return;

      }


      if (
        !data ||
        data.length === 0
      ) {

        commentList.innerHTML =
          '<div class="comment-empty">まだコメントはありません。最初のコメントを書いてね🦦</div>';


        return;

      }


      // ============================================
      // 親子関係を作る
      // ============================================

      const commentMap =
        new Map();


      data.forEach(
        comment => {

          commentMap.set(
            String(comment.id),
            {
              ...comment,
              replies: []
            }
          );

        }
      );


      const rootComments =
        [];


      data.forEach(
        comment => {

          const current =
            commentMap.get(
              String(comment.id)
            );


          if (
            comment.parent_id !== null &&
            comment.parent_id !== undefined
          ) {

            const parent =
              commentMap.get(
                String(comment.parent_id)
              );


            if (parent) {

              parent.replies.push(
                current
              );

            } else {

              rootComments.push(
                current
              );

            }

          } else {

            rootComments.push(
              current
            );

          }

        }
      );


      // ============================================
      // 表示
      // ============================================

      commentList.innerHTML =
        "";


      rootComments.forEach(
        comment => {

          renderComment(
            commentList,
            comment,
            false
          );

        }
      );

    }


    // ============================================
    // コメント表示
    // ============================================

    function renderComment(
      container,
      comment,
      isReply
    ) {

      const article =
        document.createElement(
          "article"
        );


      article.className =
        "comment-item";


      if (isReply) {

        article.classList.add(
          "reply"
        );

      }


      // ============================================
      // 名前・日付
      // ============================================

      const meta =
        document.createElement(
          "div"
        );


      meta.className =
        "comment-meta";


      const name =
        document.createElement(
          "span"
        );


      name.className =
        "comment-name";


      // 管理人

      if (
        comment.display_name ===
        "管理人"
      ) {

        name.classList.add(
          "admin"
        );

      }


      name.textContent =
        comment.display_name ||
        "名無しのラッコ";


      // 返信ラベル

      if (isReply) {

        const replyLabel =
          document.createElement(
            "span"
          );


        replyLabel.className =
          "reply-label";


        replyLabel.textContent =
          "返信";


        name.appendChild(
          replyLabel
        );

      }


      const date =
        document.createElement(
          "time"
        );


      date.className =
        "comment-date";


      date.dateTime =
        comment.created_at || "";


      date.textContent =
        formatDate(
          comment.created_at
        );


      meta.appendChild(
        name
      );


      meta.appendChild(
        date
      );


      // ============================================
      // 本文
      // ============================================

      const body =
        document.createElement(
          "p"
        );


      body.className =
        "comment-body";


      body.textContent =
        comment.body || "";


      // ============================================
      // アクション
      // ============================================

      const actions =
        document.createElement(
          "div"
        );


      actions.className =
        "comment-actions";


      const replyButton =
        document.createElement(
          "button"
        );


      replyButton.type =
        "button";


      replyButton.className =
        "reply-button";


      replyButton.textContent =
        "↩ 返信";


      actions.appendChild(
        replyButton
      );


      // ============================================
      // 返信フォーム
      // ============================================

      const replyForm =
        document.createElement(
          "form"
        );


      replyForm.className =
        "reply-form";


      replyForm.style.display =
        "none";


      const replyTitle =
        document.createElement(
          "p"
        );


      replyTitle.className =
        "reply-form-title";


      replyTitle.textContent =
        `${comment.display_name || "このコメント"}さんへ返信`;


      const replyName =
        document.createElement(
          "input"
        );


      replyName.type =
        "text";


      replyName.maxLength =
        30;


      replyName.placeholder =
        "名前";


      replyName.required =
        true;


      const replyBody =
        document.createElement(
          "textarea"
        );


      replyBody.maxLength =
        1000;


      replyBody.placeholder =
        "返信を書いてね🦦";


      replyBody.required =
        true;


      const replyButtons =
        document.createElement(
          "div"
        );


      replyButtons.className =
        "reply-form-buttons";


      const replySubmit =
        document.createElement(
          "button"
        );


      replySubmit.type =
        "submit";


      replySubmit.className =
        "reply-submit";


      replySubmit.textContent =
        "返信を投稿";


      const replyCancel =
        document.createElement(
          "button"
        );


      replyCancel.type =
        "button";


      replyCancel.className =
        "reply-cancel";


      replyCancel.textContent =
        "キャンセル";


      const replyStatus =
        document.createElement(
          "p"
        );


      replyStatus.className =
        "reply-status";


      replyStatus.setAttribute(
        "aria-live",
        "polite"
      );


      replyButtons.appendChild(
        replySubmit
      );


      replyButtons.appendChild(
        replyCancel
      );


      replyForm.appendChild(
        replyTitle
      );


      replyForm.appendChild(
        replyName
      );


      replyForm.appendChild(
        replyBody
      );


      replyForm.appendChild(
        replyButtons
      );


      replyForm.appendChild(
        replyStatus
      );


      // ============================================
      // 返信ボタン
      // ============================================

      replyButton.addEventListener(
        "click",
        () => {

          const isOpen =
            replyForm.style.display !==
            "none";


          replyForm.style.display =
            isOpen
              ? "none"
              : "block";


          if (!isOpen) {

            replyName.focus();

          }

        }
      );


      // ============================================
      // キャンセル
      // ============================================

      replyCancel.addEventListener(
        "click",
        () => {

          replyForm.reset();

          replyStatus.textContent =
            "";

          replyForm.style.display =
            "none";

        }
      );


      // ============================================
      // 返信投稿
      // ============================================

      replyForm.addEventListener(
        "submit",
        async event => {

          event.preventDefault();


          const name =
            replyName.value.trim();


          const body =
            replyBody.value.trim();


          if (
            !name ||
            !body
          ) {

            replyStatus.textContent =
              "名前と返信を入力してね🦦";


            return;

          }


          replySubmit.disabled =
            true;


          replyStatus.textContent =
            "返信を送信しています……🦦";


          const {
            error
          } =
            await supabaseClient

              .from("diary_comments")

              .insert([

                {

                  page_slug:
                    PAGE_SLUG,

                  display_name:
                    name,

                  body:
                    body,

                  approved:
                    false,

                  parent_id:
                    comment.id

                }

              ]);


          if (error) {

            console.error(
              "返信送信エラー:",
              error
            );


            replyStatus.textContent =
              "返信を送信できませんでした。もう一度試してね。";


            replySubmit.disabled =
              false;


            return;

          }


          replyForm.reset();


          replyStatus.textContent =
            "返信を送信しました！承認されると表示されます🦦";


          replySubmit.disabled =
            false;

        }
      );


      // ============================================
      // DOMへ追加
      // ============================================

      article.appendChild(
        meta
      );


      article.appendChild(
        body
      );


      article.appendChild(
        actions
      );


      article.appendChild(
        replyForm
      );


      container.appendChild(
        article
      );


      // ============================================
      // 子コメント
      // ============================================

      if (
        comment.replies &&
        comment.replies.length > 0
      ) {

        comment.replies.forEach(
          reply => {

            renderComment(
              container,
              reply,
              true
            );

          }
        );

      }

    }


    // ============================================
    // 新規コメント投稿
    // ============================================

    commentForm.addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        const name =
          commentName.value.trim();


        const body =
          commentBody.value.trim();


        if (
          !name ||
          !body
        ) {

          commentStatus.textContent =
            "名前とコメントを入力してね🦦";


          return;

        }


        commentSubmit.disabled =
          true;


        commentStatus.textContent =
          "送信中……🦦";


        const {
          error
        } =
          await supabaseClient

            .from("diary_comments")

            .insert([

              {

                page_slug:
                  PAGE_SLUG,

                display_name:
                  name,

                body:
                  body,

                approved:
                  false,

                parent_id:
                  null

              }

            ]);


        if (error) {

          console.error(
            "コメント送信エラー:",
            error
          );


          commentStatus.textContent =
            "コメントを送信できませんでした。もう一度試してね。";


          commentSubmit.disabled =
            false;


          return;

        }


        commentForm.reset();


        commentStatus.textContent =
          "コメントを送信しました！承認されると表示されます🦦";


        commentSubmit.disabled =
          false;

      }
    );


    // ============================================
    // 初期処理
    // ============================================

    loadComments();

  </script>

</body>
